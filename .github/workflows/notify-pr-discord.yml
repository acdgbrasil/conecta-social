name: notify-pr-discord

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  notify:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get Secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            6f659694-adb3-422a-bc86-b3eb018328cd > DISCORD_WEBHOOK_URL_PR

      - name: Send PR notification to Discord
        env:
          DISCORD_WEBHOOK_URL_PR: ${{ env.DISCORD_WEBHOOK_URL_PR }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL_PR}" ]; then
            echo "DISCORD_WEBHOOK_URL_PR nao configurada. Pulando notificacao."
            exit 0
          fi

          payload=$(jq -nc \
            --arg repo "${REPOSITORY}" \
            --arg title "${PR_TITLE}" \
            --arg url "${PR_URL}" \
            --arg author "${PR_AUTHOR}" \
            --arg number "${PR_NUMBER}" \
            --arg base "${PR_BASE}" \
            --arg head "${PR_HEAD}" \
            '{
              content:
                ("[PR Aberto] #" + $number + " em " + $repo + "\n" +
                 "Titulo: " + $title + "\n" +
                 "Autor: @" + $author + "\n" +
                 "Branch: " + $head + " -> " + $base + "\n" +
                 "Link: " + $url)
            }')

          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "${payload}" \
            "${DISCORD_WEBHOOK_URL_PR}"
