name: notify-pr-discord

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  notify:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get Bitwarden Secrets
        uses: ./.github/actions/get-bitwarden-secrets
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          base_url: ${{ vars.BW_BASE_URL || 'https://vault.bitwarden.com' }}
          secrets_list: |
            835f452d-51eb-4bfb-a0af-b3f0005e72d6 > DISCORD_WEBHOOK_URL_PR

      - name: Send PR notification to Discord
        env:
          DISCORD_WEBHOOK_URL_PR: ${{ env.DISCORD_WEBHOOK_URL_PR }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "${DISCORD_WEBHOOK_URL_PR}" ]; then
            echo "DISCORD_WEBHOOK_URL_PR nao configurada. Pulando notificacao."
            exit 0
          fi
          if ! echo "${DISCORD_WEBHOOK_URL_PR}" | grep -qE '^https://discord(app)?\.com/api/webhooks/'; then
            echo "DISCORD_WEBHOOK_URL_PR invalida."
            exit 1
          fi

          # Use jq --arg para escapar strings com segurança
          payload=$(jq -nc \
            --arg repo "${REPOSITORY}" \
            --arg title "${PR_TITLE}" \
            --arg url "${PR_URL}" \
            --arg author "${PR_AUTHOR}" \
            --arg number "${PR_NUMBER}" \
            --arg base "${PR_BASE}" \
            --arg head "${PR_HEAD}" \
            '{
              content:
                ("[PR Aberto] #" + $number + " em " + $repo + "\n" +
                 "Titulo: " + $title + "\n" +
                 "Autor: @" + $author + "\n" +
                 "Branch: " + $head + " -> " + $base + "\n" +
                 "Link: " + $url)
            }')

          curl --fail-with-body --retry 3 --retry-delay 2 --retry-all-errors -sS -X POST \
            -H "Content-Type: application/json" \
            -d "${payload}" \
            "${DISCORD_WEBHOOK_URL_PR}"
