name: perf-benchmarks

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: perf-benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imutable-list-hasDuplicates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate docker-compose.yml contract
        env:
          SC_DB_USER: ci_sc_user
          SC_DB_PASSWORD: ci_sc_password
          SC_DB_NAME: ci_sc_db
          LOGTO_DB_USER: ci_logto_user
          LOGTO_DB_PASSWORD: ci_logto_password
          LOGTO_DB_NAME: ci_logto_db
          LOGTO_SECRET_VAULT_KEK: ci_logto_secret_vault_kek
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.ci.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ImutableList benchmarks
        run: bun run test:perf
        env:
          IMUTABLE_LIST_PERF_THRESHOLD_PRIMITIVE: "2"
          IMUTABLE_LIST_PERF_THRESHOLD_SHALLOW: "3"
          IMUTABLE_LIST_PERF_THRESHOLD_NESTED: "5"
