name: ci-guardrails

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - "docker-compose.prod.yml"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - "docker-compose.prod.yml"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-workflows-and-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint GitHub Actions workflows
        uses: rhysd/actionlint@e7d448ef7507c20fc4c88a95d0c448b848cd6127 # v1.7.8

      - name: Validate Docker Compose interpolation
        env:
          SC_DB_USER: ci_sc_user
          SC_DB_PASSWORD: ci_sc_password
          SC_DB_NAME: ci_sc_db
          LOGTO_DB_USER: ci_logto_user
          LOGTO_DB_PASSWORD: ci_logto_password
          LOGTO_DB_NAME: ci_logto_db
          LOGTO_SECRET_VAULT_KEK: ci_logto_secret_vault_kek
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.ci.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null
