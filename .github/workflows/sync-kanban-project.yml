name: sync-kanban-project

on:
  push:
    branches:
      - main
    paths:
      - handbook/KANBAN.md
      - handbook/tasks/**
      - scripts/sync_kanban_github.py
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Executar em modo simulação (sem alterar issues/project)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write
  repository-projects: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO: acdgbrasil/conecta-social
      PROJECT_OWNER: acdgbrasil
      PROJECT_NUMBER: "10"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            393831c2-ddfc-4865-ad31-b3ee003a93d1 > PROJECT_SYNC_TOKEN

      - name: Validate token presence
        run: |
          if [ -z "${{ env.PROJECT_SYNC_TOKEN }}" ]; then
            echo "PROJECT_SYNC_TOKEN ausente no Bitwarden."
            exit 1
          fi

      - name: Validate gh auth
        run: gh auth status -h github.com
        env:
          GH_TOKEN: ${{ env.PROJECT_SYNC_TOKEN }}

      - name: Sync Kanban -> Issues/Project
        env:
          GH_TOKEN: ${{ env.PROJECT_SYNC_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/sync_kanban_github.py \
              --repo "${REPO}" \
              --project-owner "${PROJECT_OWNER}" \
              --project-number "${PROJECT_NUMBER}" \
              --dry-run
          else
            python3 scripts/sync_kanban_github.py \
              --repo "${REPO}" \
              --project-owner "${PROJECT_OWNER}" \
              --project-number "${PROJECT_NUMBER}"
          fi
