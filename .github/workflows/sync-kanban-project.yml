name: sync-kanban-project

on:
  push:
    branches:
      - main
    paths:
      - handbook/KANBAN.md
      - handbook/tasks/**
      - scripts/sync_kanban_github.py
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Executar em modo simulação (sem alterar issues/project)"
        required: false
        default: false
        type: boolean

concurrency:
  group: sync-kanban-project-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  # repository-projects: write # Removido conforme auditoria (PROJECT_SYNC_TOKEN já tem permissões)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO: acdgbrasil/conecta-social
      PROJECT_OWNER: acdgbrasil
      PROJECT_NUMBER: "10"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get Bitwarden Secrets
        uses: ./.github/actions/get-bitwarden-secrets
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          base_url: ${{ vars.BW_BASE_URL || 'https://vault.bitwarden.com' }}
          secrets_list: |
            393831c2-ddfc-4865-ad31-b3ee003a93d1 > PROJECT_SYNC_TOKEN

      - name: Validate sync script syntax
        run: python3 -m py_compile scripts/sync_kanban_github.py

      - name: Sync Kanban -> Issues/Project
        env:
          GH_TOKEN: ${{ env.PROJECT_SYNC_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "ERRO: PROJECT_SYNC_TOKEN ausente."
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/sync_kanban_github.py \
              --repo "${REPO}" \
              --project-owner "${PROJECT_OWNER}" \
              --project-number "${PROJECT_NUMBER}" \
              --dry-run
          else
            python3 scripts/sync_kanban_github.py \
              --repo "${REPO}" \
              --project-owner "${PROJECT_OWNER}" \
              --project-number "${PROJECT_NUMBER}"
          fi
