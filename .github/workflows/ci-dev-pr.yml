name: ci-dev-pr

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-dev-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Get Bitwarden Secrets
        uses: ./.github/actions/get-bitwarden-secrets
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          base_url: ${{ vars.BW_BASE_URL || 'https://vault.bitwarden.com' }}
          secrets_list: |
            9c5a931e-9fcf-4817-b172-b3f0005666c4 > SC_DB_USER
            70a8c524-eb0a-4445-a727-b3f000567938 > SC_DB_PASSWORD
            45fbd2b8-ff01-4a80-97c4-b3f0005686f1 > SC_DB_NAME
            5d8afa20-b076-4a3b-9700-b3f000569356 > LOGTO_DB_USER
            c90805b0-af63-4df5-964c-b3f00056a0bc > LOGTO_DB_PASSWORD
            67b4b209-fa3d-4393-8471-b3f00056ad34 > LOGTO_DB_NAME
            ee00b47a-ecc9-4c02-999d-b3f00056bce2 > LOGTO_SECRET_VAULT_KEK

      - name: Setup Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2
        with:
          bun-version: "1.3.8"

      - name: Cache Bun dependencies
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure Postgres client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Prepare .env for Docker Compose
        env:
          SC_DB_USER: ${{ env.SC_DB_USER }}
          SC_DB_PASSWORD: ${{ env.SC_DB_PASSWORD }}
          SC_DB_NAME: ${{ env.SC_DB_NAME }}
          LOGTO_DB_USER: ${{ env.LOGTO_DB_USER }}
          LOGTO_DB_PASSWORD: ${{ env.LOGTO_DB_PASSWORD }}
          LOGTO_DB_NAME: ${{ env.LOGTO_DB_NAME }}
          LOGTO_SECRET_VAULT_KEK: ${{ env.LOGTO_SECRET_VAULT_KEK }}
        run: |
          cat > .env.ci <<EOF
          SC_DB_USER=${SC_DB_USER}
          SC_DB_PASSWORD=${SC_DB_PASSWORD}
          SC_DB_NAME=${SC_DB_NAME}
          LOGTO_DB_USER=${LOGTO_DB_USER}
          LOGTO_DB_PASSWORD=${LOGTO_DB_PASSWORD}
          LOGTO_DB_NAME=${LOGTO_DB_NAME}
          LOGTO_SECRET_VAULT_KEK=${LOGTO_SECRET_VAULT_KEK}
          EOF

      - name: Validate Docker Compose contract
        run: docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml config > /dev/null

      - name: Start Postgres stack via Docker Compose
        run: |
          docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml up -d postgres
          docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml ps

      - name: Wait for Postgres readiness
        env:
          SC_DB_USER: ${{ env.SC_DB_USER }}
          SC_DB_NAME: ${{ env.SC_DB_NAME }}
        run: |
          for i in $(seq 1 30); do
            if docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml exec -T postgres pg_isready -U "${SC_DB_USER}" -d "${SC_DB_NAME}" >/dev/null 2>&1; then
              echo "Postgres pronto."
              exit 0
            fi
            sleep 2
          done
          echo "Postgres não ficou pronto a tempo."
          docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml logs --no-color postgres
          exit 1

      - name: Run migrations
        env:
          PGPASSWORD: ${{ env.SC_DB_PASSWORD }}
          SC_DB_HOST: 127.0.0.1
          SC_DB_PORT: "5433"
          SC_DB_USER: ${{ env.SC_DB_USER }}
          SC_DB_NAME: ${{ env.SC_DB_NAME }}
        run: |
          for file in src/modules/social-care/interface/database/postgres/migrations/*.sql; do
            echo "Aplicando migration: ${file}"
            psql \
              -v ON_ERROR_STOP=1 \
              -h "${SC_DB_HOST}" \
              -p "${SC_DB_PORT}" \
              -U "${SC_DB_USER}" \
              -d "${SC_DB_NAME}" \
              -f "${file}"
          done

      - name: Lint
        run: bun run lint

      - name: Run tests (dev scope)
        env:
          SC_DB_HOST: 127.0.0.1
          SC_DB_PORT: "5433"
          SC_DB_USER: ${{ env.SC_DB_USER }}
          SC_DB_PASSWORD: ${{ env.SC_DB_PASSWORD }}
          SC_DB_NAME: ${{ env.SC_DB_NAME }}
        run: |
          bun test \
            src/shared/tests/unit \
            src/modules/social-care/domain/tests \
            src/modules/social-care/application/tests \
            src/modules/social-care/interface/tests

      - name: Capture Docker diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml ps || true
          docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml logs --no-color postgres > postgres-ci.log || true

      - name: Upload Docker diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-dev-pr-docker-logs
          path: postgres-ci.log
          if-no-files-found: ignore

      - name: Stop Docker Compose services
        if: always()
        run: docker compose --env-file .env.ci -f docker-compose.yml -f docker-compose.ci.yml down -v
