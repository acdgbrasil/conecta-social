name: ci-dev-pr

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-dev-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SC_DB_HOST: 127.0.0.1
      SC_DB_PORT: "5432"
      SC_DB_USER: ${{ secrets.SC_DB_USER }}
      SC_DB_PASSWORD: ${{ secrets.SC_DB_PASSWORD }}
      SC_DB_NAME: ${{ secrets.SC_DB_NAME }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ secrets.SC_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.SC_DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.SC_DB_NAME }}
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Ensure Postgres client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h "${SC_DB_HOST}" -p "${SC_DB_PORT}" -U "${SC_DB_USER}" -d "${SC_DB_NAME}"; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres nao ficou pronto a tempo."
          exit 1

      - name: Run migrations
        env:
          PGPASSWORD: ${{ env.SC_DB_PASSWORD }}
        run: |
          for file in src/modules/social-care/interface/database/postgres/migrations/*.sql; do
            echo "Aplicando migration: ${file}"
            psql \
              -v ON_ERROR_STOP=1 \
              -h "${SC_DB_HOST}" \
              -p "${SC_DB_PORT}" \
              -U "${SC_DB_USER}" \
              -d "${SC_DB_NAME}" \
              -f "${file}"
          done

      - name: Lint
        continue-on-error: true
        run: bun run lint

      - name: Run tests (dev scope)
        run: |
          bun test \
            src/shared/tests/unit \
            src/modules/social-care/domain/tests \
            src/modules/social-care/application/tests \
            src/modules/social-care/interface/tests
