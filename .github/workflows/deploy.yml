name: DevSecOps Guardian CI/CD

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - dev
      - main
      - production
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel for manual production runs'
        required: false
        default: rc
        type: choice
        options:
          - alpha
          - beta
          - rc
          - stable

env:
  BUN_VERSION: '1.1.18'
  BUN_FLAGS: '--frozen-lockfile'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Static & Security Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install core tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install & Validate Packages
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          mkdir -p "${ROOT}/reports/packages"
          for pkg in "${ROOT}"/packages/*; do
            [ -d "${pkg}" ] || continue
            if [ ! -f "${pkg}/package.json" ]; then
              continue
            fi
            NAME="$(basename "${pkg}")"
            echo "::group::Validando ${NAME}"
            pushd "${pkg}" >/dev/null
            if [ -f bun.lockb ] || [ -f bun.lock ]; then
              bun install ${BUN_FLAGS} || bun install
            else
              bun install
            fi
            if jq -e '.scripts.validate' package.json >/dev/null 2>&1; then
              bun run validate | tee "${ROOT}/reports/packages/${NAME}-validate.log"
            elif jq -e '.scripts.ci' package.json >/dev/null 2>&1; then
              bun run ci | tee "${ROOT}/reports/packages/${NAME}-validate.log"
            else
              echo "Nenhum script validate/ci definido para ${NAME}" | tee "${ROOT}/reports/packages/${NAME}-validate.log"
            fi
            if jq -e '.scripts.test' package.json >/dev/null 2>&1; then
              mkdir -p "${ROOT}/reports/tests"
              bun run test || true
            fi
            popd >/dev/null
            echo "::endgroup::"
          done

      - name: Upload package validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-validation
          path: reports/packages
          if-no-files-found: ignore

      - name: Secrets Scan (Code Layer)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --config=gitleaks.toml --redact --report-format json --report-path reports/gitleaks.json

      - name: Dependency Audit (SCA + SBOM)
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          mkdir -p "${ROOT}/reports/audit"
          for pkg in "${ROOT}"/packages/*; do
            [ -d "${pkg}" ] || continue
            if [ ! -f "${pkg}/package.json" ]; then
              continue
            fi
            NAME="$(basename "${pkg}")"
            pushd "${pkg}" >/dev/null
            bun audit --json > "${ROOT}/reports/audit/${NAME}.json" || true
            popd >/dev/null
          done

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/gitleaks.json
            reports/audit
            reports/trivy.txt
          if-no-files-found: ignore

      - name: QA End-to-End
        if: >
          (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'dev') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/dev')
        run: |
          if compgen -G "tests/e2e/**/*.ts" > /dev/null; then
            echo "Executando testes E2E"
            bun test --filter e2e || true
          else
            echo "Nenhum teste E2E encontrado, pulando."
          fi

      - name: Integration API Tests
        if: >
          (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main') ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          if [ -f tests/integration/collection.json ]; then
            sudo npm install -g newman
            if [ -f tests/integration/collection.env.json ]; then
              newman run tests/integration/collection.json --environment tests/integration/collection.env.json
            else
              newman run tests/integration/collection.json
            fi
          else
            echo "Nenhuma coleção Newman encontrada, pulando."
          fi

      - name: Container Scan (Trivy)
        if: >
          (github.event_name == 'pull_request' && contains(fromJson('["main","production"]'), github.event.pull_request.base.ref)) ||
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'))
        uses: aquasecurity/trivy-action@0.22.0
        with:
          scan-type: fs
          scan-ref: .
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: reports/trivy.txt

      - name: Policy-as-Code (Conftest)
        if: >
          hashFiles('policies/**') != '' && hashFiles('manifests/**') != ''
        run: |
          docker run --rm -v "${PWD}:/project" openpolicyagent/conftest:v0.45.0 test /project/manifests --policy /project/policies

      - name: Cloud Guardrails (tfsec)
        if: hashFiles('iac/**/*.tf') != ''
        uses: aquasecurity/tfsec-action@v1.0.6
        with:
          working-directory: iac
          soft-fail: true

      - name: Build Bun Binary
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
        run: |
          set -euo pipefail
          mkdir -p build
          bun build packages/legacy/src/index.ts --compile --outfile build/conecta-social

      - name: Upload Bun artifact
        if: (github.ref == 'refs/heads/main') || (github.ref == 'refs/heads/production')
        uses: actions/upload-artifact@v4
        with:
          name: bun-binary
          path: build/conecta-social

      - name: Generate Release Documentation
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get install -y jq
          fi
          mkdir -p release
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "${PREVIOUS_TAG}" ]; then
            RANGE="${PREVIOUS_TAG}..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi
          git log --pretty=format:'- %h %s (%an)' ${RANGE} > release/notes.md
          VERSION="$(date -u +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"
          echo "${VERSION}" > release/VERSION
          jq -n --arg version "${VERSION}" --arg sha "${GITHUB_SHA}" --arg channel "${{ github.event.inputs.release_channel || 'rc' }}" \
            --arg date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{version:$version, commit:$sha, channel:$channel, built_at:$date}' > release/metadata.json

      - name: Upload release artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release

  deploy_dev:
    name: Deploy DEV Environment
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Deploy to DEV
        env:
          GIT_COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x bin/deploy.sh
          if [ -f build/conecta-social ]; then
            bin/deploy.sh dev build/conecta-social || bin/deploy.sh dev
          else
            bin/deploy.sh dev
          fi

  release_main:
    name: Promote to Release Candidate
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Bun artifact
        uses: actions/download-artifact@v4
        with:
          name: bun-binary
          path: build
      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release
      - name: Deploy staging candidate
        env:
          GIT_COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x bin/deploy.sh
          bin/deploy.sh staging build/conecta-social || true

  release_production:
    name: Production Release
    needs: validate
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/production') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Bun artifact
        uses: actions/download-artifact@v4
        with:
          name: bun-binary
          path: build
      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release
      - name: Deploy production bundle
        env:
          GIT_COMMIT: ${{ github.sha }}
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel || 'rc' }}
        run: |
          chmod +x bin/deploy.sh
          bin/deploy.sh production build/conecta-social
