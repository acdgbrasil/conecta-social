version: v1
plugins:
  # TypeScript/JavaScript generation
  - plugin: buf.build/protocolbuffers/js
    out: packages/shared/infrastructure/contracts/gen/js
  - plugin: buf.build/bufbuild/es
    out: packages/shared/infrastructure/contracts/gen/ts
    opt: target=ts

  # Swift generation
  - plugin: buf.build/apple/swift
    out: packages/acdg/queue-orquestration/Sources/Generated
  - plugin: buf.build/grpc/swift
    out: packages/acdg/queue-orquestration/Sources/Generated
