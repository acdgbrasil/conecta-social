name: "envolve-platform"

services:
  # ==========================================
  # Bounded Context: Social Care (Bun)
  # ==========================================
  conecta-raros:
    build:
      context: ../../packages/conecta-raros
      dockerfile: Dockerfile
    container_name: conecta-raros-service
    restart: unless-stopped
    ports:
      - "3000:3000" # API Gateway / HTTP
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/social_care_db
      - REDIS_URL=redis://redis:6379/0
      - ACDG_GRPC_URL=acdg-service:50051 # Comunicação interna via nome do serviço
    depends_on:
      - postgres
      - redis
    networks:
      - envolve-network

  # ==========================================
  # Bounded Context: ACDG (Swift)
  # ==========================================
  acdg:
    build:
      context: ../../packages/acdg
      dockerfile: Dockerfile
    container_name: acdg-service
    restart: unless-stopped
    # Não expomos porta 50051 para o host (mundo externo), 
    # apenas dentro da rede do Docker para o 'conecta-raros' acessar.
    # Se precisar debugar, descomente:
    # ports:
    #   - "50051:50051" 
    environment:
      - GRPC_PORT=50051
      - DATABASE_URL=postgres://user:password@postgres:5432/acdg_db
    depends_on:
      - postgres
    networks:
      - envolve-network

  # ==========================================
  # Infraestrutura Compartilhada (Dev/Local)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: envolve-postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: social_care_db # DB default, outros devem ser criados via script de init
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - envolve-network

  redis:
    image: redis:7-alpine
    container_name: envolve-redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - envolve-network

networks:
  envolve-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
