<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Conecta Raros - Download Seguro</title>
<style>
  /* Reset básico */
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  body, html {
    height: 100%;
    background: linear-gradient(135deg, #4a90e2, #50e3c2);
    color: #fff;
  }

  .container {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 2rem;
    text-align: center;
  }

  h1 {
    font-weight: 700;
    font-size: 2.5rem;
    margin-bottom: 1rem;
    text-shadow: 0 2px 5px rgba(0,0,0,0.3);
  }

  p {
    font-size: 1.25rem;
    max-width: 500px;
    margin-bottom: 2.5rem;
    line-height: 1.5;
    text-shadow: 0 1px 3px rgba(0,0,0,0.25);
  }

  button {
    background-color: #fff;
    color: #4a90e2;
    font-size: 1.2rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    padding: 1rem 2.5rem;
    cursor: pointer;
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  button:hover {
    background-color: #3b7ccc;
    color: #fff;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Bem-vindo ao Conecta Raros</h1>
    <p>Para proteger seu acesso, é necessário informar a senha antes de obter o programa para Windows.</p>
    <button id="btnDownload">Obtenha o programa Windows agora</button>
  </div>

  <script>
    const senhaCorreta = "tomate98"; // Ajusta a senha aqui

    document.getElementById("btnDownload").addEventListener("click", () => {
      const senha = prompt("Por favor, digite a senha para acessar o download:");

      if (senha === null) {
        alert("Download cancelado.");
        return;
      }

      if (senha === senhaCorreta) {
        // Redireciona pra /downloads
        window.location.href = "/downloads";
      } else {
        alert("Senha incorreta. Tente novamente.");
      }
    });
  </script>
</body>
</html>
